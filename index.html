    <style>
      :root {
        color-scheme: light dark;
        --bg: #fdf6d8; --fg: #2a2410; --muted: #77683a; --accent: #7d6100; --surface: #f5ebbc; --border: #e2d391;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #16130a; --fg: #f0ead2; --muted: #b0a67f; --accent: #ffeeaa; --surface: #241f10; --border: #4a4227;
        }
      }

      html { margin: 0; padding: 0; }
      body {
        margin: 0;
        padding: 1.5rem 1rem 3rem;
        background: var(--bg);
        color: var(--fg);
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Noto Sans", sans-serif;
        font-size: 1.0625rem;
        line-height: 1.6;
      }
      h1 { margin: 0 0 1rem; font-size: 2rem; line-height: 1.3; }
      a { color: var(--accent); }
      a:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

      /* The skip-link — the family's pattern (lot 2, retours 2026-08-22):
         parked above the viewport, revealed on keyboard focus, first in
         the tab order. */
      .skip-link {
        position: absolute;
        top: -100%;
        left: 0;
        padding: .5em 1em;
        background-color: var(--bg);
        z-index: 200;
      }
      .skip-link:focus {
        top: 0;
      }

      /* ── Chrome band — the family convention (retours 2026-08-22):
         the app's fluid grid (one square = a tenth of the viewport's
         short side), the logo at the ICON footprint (square/1.6) in a
         piece-size tile — a doorway to the apex, no fill in any state —
         and Sanki's own Play button at the right, declaration for
         declaration on the chrome tokens: piece-size tall, piece-margin
         border in the page ground at rest, radius square/8, padding
         square/4, label at square/2.4, sword at square/1.6. */
      @media (orientation: landscape) {
        :root { --chrome-content: 100vh; }
      }
      @media (orientation: portrait) {
        :root { --chrome-content: 100vw; }
      }
      :root {
        --chrome-square: calc(var(--chrome-content) / 10);
        --chrome-piece: calc(var(--chrome-square) * 0.85);
        --chrome-margin: calc((var(--chrome-square) - var(--chrome-piece)) / 2);
      }
      body > header {
        display: block;
        padding-top: var(--chrome-square);
      }
      body > header > nav {
        position: absolute;
        top: 0;
        left: 0;
        height: var(--chrome-square);
        display: flex;
        align-items: center;
        margin: 0;
        z-index: 100;
      }
      body > header > nav a {
        display: grid;
        place-items: center;
        width: var(--chrome-piece);
        height: var(--chrome-piece);
        margin: var(--chrome-margin);
      }
      body > header > nav img {
        display: block;
        width: calc(var(--chrome-square) / 1.6);
        height: calc(var(--chrome-square) / 1.6);
        max-width: none;
        max-height: none;
        margin: 0;
      }
      body > header > aside {
        position: absolute;
        top: 0;
        right: 0;
        height: var(--chrome-square);
        display: flex;
        align-items: center;
        z-index: 100;
      }
      body > header > aside > a {
        display: inline-flex;
        align-items: center;
        gap: calc(var(--chrome-square) / 8);
        box-sizing: border-box;
        height: var(--chrome-piece);
        margin: var(--chrome-margin);
        padding-inline: calc(var(--chrome-square) / 4);
        border: var(--chrome-margin) solid var(--bg);
        border-radius: calc(var(--chrome-square) / 8);
        background: var(--accent);
        color: var(--bg);
        font-size: calc(var(--chrome-square) / 2.4);
        font-weight: 600;
        white-space: nowrap;
        text-decoration: none;
        transition: border-color 0.25s;
      }
      body > header > aside > a > svg {
        width: calc(var(--chrome-square) / 1.6);
        height: calc(var(--chrome-square) / 1.6);
        flex: none;
        fill: none;
        stroke: currentColor;
        stroke-width: 2;
        stroke-linecap: round;
        stroke-linejoin: round;
      }
      body > header > aside > a:hover,
      body > header > aside > a:active,
      body > header > aside > a:focus-visible {
        border-color: var(--border);
      }

      /* The reading column — a puzzle is a narrow thing: title, statement,
         diagram, one line of proof. The cap keeps desktop lines readable
         and centres the composition; phones never meet it. */
      main, body > footer {
        max-width: 44rem;
        margin-inline: auto;
      }

      .muted { color: var(--muted); }

      /* The diagram — the vector, fluid, on its white plate (the renderer
         draws ink with no ground of its own, so the plate is what keeps
         the lines legible in the dark scheme too), capped at a size a
         mate-in-2 deserves rather than the whole viewport. */
      figure { margin: 2rem auto; text-align: center; }
      figure img {
        display: inline-block;
        width: 100%;
        max-width: 32rem;
        height: auto;
        background: #fff;
        border: 1px solid var(--border);
        border-radius: 0.5rem;
      }
      pre {
        padding: .75rem 1rem;
        background: var(--surface);
        border: 1px solid var(--border);
        border-radius: 0.5rem;
        overflow-x: auto;
        font-size: .85rem;
      }
      /* The solution, folded shut — a spoiler is exactly what <details>
         is for: closed by print and by every first paint, opened by one
         gesture, no script anywhere. */
      details {
        margin: 2rem 0;
        padding: .75rem 1rem;
        background: var(--surface);
        border: 1px solid var(--border);
        border-radius: 0.5rem;
      }
      details summary { cursor: pointer; font-weight: 600; }
      details p { margin: .75rem 0 0; }
      /* The calendar — the family's door tiles (the rules sites' language
         doors, dress for dress): surface, border, a ring that tints on
         hover and moves nothing. */
      ul.puzzles {
        list-style: none;
        margin: 1rem 0 0;
        padding: 0;
        display: grid;
        gap: 0.6rem;
      }
      ul.puzzles a {
        display: block;
        padding: 0.75rem 1.25rem;
        background: var(--surface);
        border: 1px solid var(--border);
        border-radius: 0.75rem;
        text-decoration: none;
        font-size: 1.15rem;
      }
      ul.puzzles a:hover,
      ul.puzzles a:focus-visible {
        border-color: var(--accent);
      }
      /* The pager holds only the links that exist — no placeholder
         element: a lone "newer" link pushes itself to the right edge. */
      nav.pager { display: flex; justify-content: space-between; gap: 1rem; margin-top: 2rem; }
      nav.pager > a[rel="next"] { margin-inline-start: auto; }
      footer {
        margin-top: 3rem;
        padding-top: 1rem;
        border-top: 1px solid var(--border);
        font-size: .85rem;
        color: var(--muted);
      }
      @media print {
        .skip-link { display: none; }
        body > header > aside { display: none; }
      }
